name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest
    strategy:
      fail-fast: false
      matrix:
        loader: [ pcdrv, cdrom, archive ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Build
        run: make -j4 all LOADER=${{ matrix.loader }}
      - name: Build the smallest engine
        run: make -j4 all LOADER=${{ matrix.loader }} FEATURES=none

  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Build
        run: |
          make -j4 all LOADER=pcdrv
          make -j4 -C third_party/nugget/openbios
      - name: Fetch pcsx-redux
        run: tests/boot/fetch-redux.sh "$RUNNER_TEMP/redux"
      - name: Boot the test scene
        run: tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe 120
      - name: Chained cutscenes
        run: |
          tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe 300 tests/boot/fixture-cutscene 'BOOT OK: cutscenes'
      - name: Lua breakpoints
        run: |
          tests/boot/luadebug.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe 120
          NOBP=1 tests/boot/luadebug.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe 120
      - name: Particle emitters
        run: |
          tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe 300 tests/boot/fixture-particles 'BOOT OK: particles'
      - name: Movies
        # A cdrom build on a disc of the scene and two clips: Movie.Play full screen, then Movie.PlayOn on a crate. The
        # script's line says both ended; the engine's own counts say they showed every frame.
        run: |
          make clean
          make -j4 all LOADER=cdrom
          f=tests/boot/fixture-movie
          python3 tests/boot/mkdisc.py "$RUNNER_TEMP/movie.bin" SCENE0/SCENE_0.SPK=$f/scene_0.splashpack \
            SCENE0/SCENE_0.VRM=$f/scene_0.vram SCENE0/SCENE_0.SPU=$f/scene_0.spu MOVIES/CLIP.STR=$f/CLIP.STR MOVIES/TV.SBS=$f/TV.SBS
          BOOT_ISO="$RUNNER_TEMP/movie.cue" BOOT_LOG="$RUNNER_TEMP/movie.log" tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe 300 $f 'BOOT OK: movies'
          grep -F 'Movie CLIP: shown 12 dropped 0 rejected 0 read errors 0' "$RUNNER_TEMP/movie.log"
          grep -F 'Movie TV: ended, 58 of 58 frames shown' "$RUNNER_TEMP/movie.log"

  boot-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Build
        run: |
          make -j4 all LOADER=archive
          make -j4 -C third_party/nugget/openbios
      - name: Fetch pcsx-redux
        run: tests/boot/fetch-redux.sh "$RUNNER_TEMP/redux"
      - name: Build the authoring tool
        run: tests/boot/fetch-authoring.sh "$RUNNER_TEMP/authoring"
      - name: Boot the test scene from the drive and over PCdrv
        run: tests/boot/boot-archive.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe "$RUNNER_TEMP/authoring/authoring" 120

  xmake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest
    env:
      # The container runs as root, which xmake refuses without this.
      XMAKE_ROOT: y
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Build every engine
        run: |
          xmake f -y
          xmake -y -j 4
          for n in psxsplash psxsplash-cdrom psxsplash-perf psxsplash-rooms psxsplash-perf-rooms; do
            test -s build/psx/mipsel/release/$n.ps-exe
          done
      - name: Build every engine without the boot logo
        run: |
          xmake f -y --features=net,ui,sprites,skin,cutscene,lights,streaming,memcard,nav,agents,collision,shadows,backgrounds,shine,particles,movie
          xmake -y -j 4
          for n in psxsplash psxsplash-cdrom psxsplash-perf psxsplash-rooms psxsplash-perf-rooms; do
            test -s build/psx/mipsel/release/$n-nologo.ps-exe
          done
      - name: Build openbios
        run: make -j4 -C third_party/nugget/openbios
      - name: Fetch pcsx-redux
        run: tests/boot/fetch-redux.sh "$RUNNER_TEMP/redux"
      - name: Boot the test scene
        run: tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin build/psx/mipsel/release/psxsplash.ps-exe 120

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make -C tests/host
