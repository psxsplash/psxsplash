name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Build
        run: make -j4 all
      - name: Build the smallest engine
        run: make -j4 all FEATURES=none

  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Build
        run: |
          make -j4 all
          make -j4 -C third_party/nugget/openbios
      - name: Fetch pcsx-redux
        run: tests/boot/fetch-redux.sh "$RUNNER_TEMP/redux"
      - name: Build the authoring tool
        run: tests/boot/fetch-authoring.sh "$RUNNER_TEMP/authoring"
      # Each fixture is packed into psxsplash.bin and read over PCdrv with no disc, as Play runs it.
      - name: Boot the test scene
        run: tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe "$RUNNER_TEMP/authoring/authoring" 120
      - name: Chained cutscenes
        run: |
          tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe "$RUNNER_TEMP/authoring/authoring" 300 tests/boot/fixture-cutscene 'BOOT OK: cutscenes'
      - name: Lua breakpoints
        run: |
          tests/boot/luadebug.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe "$RUNNER_TEMP/authoring/authoring" 120
          NOBP=1 tests/boot/luadebug.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe "$RUNNER_TEMP/authoring/authoring" 120
      - name: Particle emitters
        run: |
          tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe "$RUNNER_TEMP/authoring/authoring" 300 tests/boot/fixture-particles 'BOOT OK: particles'
      # Movies get an engine-CI fixture once Redux's authoring tool encodes movies itself.

  boot-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Build
        run: |
          make -j4 all
          make -j4 -C third_party/nugget/openbios
      - name: Fetch pcsx-redux
        run: tests/boot/fetch-redux.sh "$RUNNER_TEMP/redux"
      - name: Build the authoring tool
        run: tests/boot/fetch-authoring.sh "$RUNNER_TEMP/authoring"
      - name: Boot the test scene from the drive and over PCdrv
        run: tests/boot/boot-archive.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin psxsplash.ps-exe "$RUNNER_TEMP/authoring/authoring" 120

  xmake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest
    env:
      # The container runs as root, which xmake refuses without this.
      XMAKE_ROOT: y
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Build every engine
        run: |
          xmake f -y
          xmake -y -j 4
          for n in psxsplash psxsplash-perf psxsplash-rooms psxsplash-perf-rooms; do
            test -s build/psx/mipsel/release/$n.ps-exe
          done
      - name: Build every engine without the boot logo
        run: |
          xmake f -y --features=net,ui,sprites,skin,cutscene,lights,streaming,memcard,nav,agents,collision,shadows,backgrounds,shine,particles,movie
          xmake -y -j 4
          for n in psxsplash psxsplash-perf psxsplash-rooms psxsplash-perf-rooms; do
            test -s build/psx/mipsel/release/$n-nologo.ps-exe
          done
      - name: Build openbios
        run: make -j4 -C third_party/nugget/openbios
      - name: Fetch pcsx-redux
        run: tests/boot/fetch-redux.sh "$RUNNER_TEMP/redux"
      - name: Build the authoring tool
        run: tests/boot/fetch-authoring.sh "$RUNNER_TEMP/authoring"
      - name: Boot the test scene
        run: tests/boot/boot.sh "$RUNNER_TEMP/redux/squashfs-root/AppRun" third_party/nugget/openbios/openbios.bin build/psx/mipsel/release/psxsplash.ps-exe "$RUNNER_TEMP/authoring/authoring" 120

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make -C tests/host
